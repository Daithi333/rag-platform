name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run type check
        run: uv run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_platform_test_db
          POSTGRES_USER: rag_platform_user
          POSTGRES_PASSWORD: rag_platform_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rag_platform_user -d rag_platform_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES__DATABASE_URL: postgresql+psycopg2://rag_platform_user:rag_platform_password@localhost:5432/rag_platform_test_db
      POSTGRES__TEST_DATABASE_URL: postgresql+psycopg2://rag_platform_user:rag_platform_password@localhost:5432/rag_platform_test_db

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/unit tests/api tests/integration -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
