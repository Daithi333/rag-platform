x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    - AIRFLOW_HOME=/opt/airflow
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/airflow_db
    - AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE=10
    - AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW=20
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__PARALLELISM=4
    - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-webserver:8080
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
    - AIRFLOW__API_AUTH__JWT_SECRET=rag-platform-airflow-jwt-secret-key-for-local-dev-must-be-at-least-64-bytes-long
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=True
    - POSTGRES__DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/rag_platform_db
    - OPENSEARCH__HOST=http://opensearch:9200
    - OLLAMA__HOST=http://ollama:11434
    - REDIS__HOST=redis
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
  networks:
    - rag-platform-network

services:
  api:
    build:
      context: .
      target: dev
    container_name: rag-platform-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    networks:
      - rag-platform-network

  postgres:
    image: postgres:16-alpine
    container_name: rag-platform-postgres
    attach: false
    environment:
      - POSTGRES_DB=rag_platform_db
      - POSTGRES_USER=rag_platform_user
      - POSTGRES_PASSWORD=rag_platform_password
      - POSTGRES_HOST_AUTH_METHOD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_platform_user -d rag_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rag-platform-network

  airflow-postgres:
    image: postgres:16-alpine
    container_name: rag-airflow-postgres
    attach: false
    profiles:
      - airflow
    environment:
      - POSTGRES_DB=airflow_db
      - POSTGRES_USER=${AIRFLOW_POSTGRES_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d airflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rag-platform-network

  airflow-init:
    <<: *airflow-common
    container_name: rag-airflow-init
    profiles:
      - airflow
    command: ["/entrypoint.sh", "init"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: rag-airflow-webserver
    profiles:
      - airflow
    command: ["/entrypoint.sh", "api-server"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: rag-airflow-scheduler
    profiles:
      - airflow
    command: ["/entrypoint.sh", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: rag-airflow-dag-processor
    profiles:
      - airflow
    command: [ "/entrypoint.sh", "dag-processor" ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: rag-platform-opensearch
    attach: false
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - rag-platform-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: rag-platform-opensearch-dashboards
    attach: false
    profiles:
      - dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-platform-network

  gradio:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag-platform-gradio
    profiles:
      - rag
    ports:
      - "7860:7860"
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-platform-network

  ollama:
    image: ollama/ollama:latest
    container_name: rag-platform-ollama
    profiles:
      - rag
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - rag-platform-network

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
  opensearch_data:
  ollama_data:

networks:
  rag-platform-network:
    driver: bridge
