services:
  # API service
  api:
    build: .
    container_name: rag-platform-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    networks:
      - rag-platform-network

networks:
  rag-platform-network:
    driver: bridge
